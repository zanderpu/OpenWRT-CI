#CI项目（私有定制：仅编译 IPQ60XX-WIFI-YES 与 X86）
name: PRIVATE

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      TARGET:
        description: '选择要编译的目标（all = 全部一起编译）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - IPQ60XX-WIFI-YES
          - X86
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: Set Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate Matrix
        id: gen
        run: |
          TARGET="${{ github.event.inputs.TARGET || 'all' }}"
          case "$TARGET" in
            IPQ60XX-WIFI-YES)
              MATRIX='{"include":[{"CONFIG":"IPQ60XX-WIFI-YES","SOURCE":"VIKINGYFY/immortalwrt","BRANCH":"main"}]}'
              ;;
            X86)
              MATRIX='{"include":[{"CONFIG":"X86","SOURCE":"VIKINGYFY/immortalwrt","BRANCH":"owrt"}]}'
              ;;
            *)
              MATRIX='{"include":[{"CONFIG":"IPQ60XX-WIFI-YES","SOURCE":"VIKINGYFY/immortalwrt","BRANCH":"main"},{"CONFIG":"X86","SOURCE":"VIKINGYFY/immortalwrt","BRANCH":"owrt"}]}'
              ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
  
  build:
    name: ${{matrix.CONFIG}}
    needs: config
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.matrix) }}
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: AX1800Pro
      #默认WIFI名称
      WRT_SSID: JDC_AX1800Pro
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.1.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
